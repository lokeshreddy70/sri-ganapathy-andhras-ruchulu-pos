[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/fonts/**",
    "netlify/functions/assets/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/pos"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pos/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/admin/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/kds"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/kds/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/order/*"
  to = "/customer/?token=:splat"
  status = 200
  force = true
