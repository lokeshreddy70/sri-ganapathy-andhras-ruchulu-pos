<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"><title>Kitchen Display · Sri Ganapathy</title><style>body{margin:0;background:#101816;color:#edf5f1;font-family:Inter,Segoe UI,Arial}.top{height:62px;background:#16221e;border-bottom:1px solid #2a3933;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:37px;height:37px;border-radius:10px}.brand b{font:700 15px Georgia,serif}.brand small{display:block;color:#82918b;font-size:7px;letter-spacing:1px}.top span{font-size:9px;color:#aebbb5}.grid{padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{background:#f7faf8;color:#17221d;border-radius:10px;overflow:hidden;border-top:4px solid #d6a017}.head{padding:10px;border-bottom:1px solid #e2e8e4;display:flex;justify-content:space-between}.head b{font-size:12px}.head span{font-size:8px;color:#78837d}.body{padding:10px}.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e7ebe8;font-size:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:9px}.actions button{border:0;border-radius:5px;padding:8px;font-size:8px;font-weight:800;background:#e8efeb;color:#174b33}.actions .go{background:#0e8746;color:#fff}.empty{grid-column:1/-1;text-align:center;padding:70px;color:#75837b;font-size:11px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><img src="/brand/logo-icon.jpg"><div><b>Sri Ganapathy · Kitchen</b><small>ANDHRA'S RUCHULU · LIVE KDS</small></div></div><span id="clock"></span></header><main class="grid" id="grid"></main><script src="/socket.io/socket.io.js"></script><script>let branchId=null;const q=new URLSearchParams(location.search);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw Error('Request failed');return r.json()};async function init(){try{const me=await api('/api/me');branchId=me.user.branchId;render();const s=io();s.emit('join:branch',branchId);s.on('order:new',render);s.on('order:update',render)}catch{location.href='/pos/'}}async function render(){if(!branchId)return;const rows=await api('/api/orders?branchId='+branchId);const active=rows.filter(o=>['PENDING','ACCEPTED','PREPARING','READY'].includes(o.status));document.querySelector('#grid').innerHTML=active.map(o=>`<article class="card"><div class="head"><b>#${o.number} · ${o.bench?.label||'Counter'}</b><span>${o.source}</span></div><div class="body">${o.lines.map(l=>`<div class="line"><span>${l.menuItem.name}</span><b>× ${l.quantity}</b></div>`).join('')}<div style="margin-top:8px;font-size:8px;color:#6c7871">${o.notes||''}</div><div class="actions">${o.status==='PENDING'?`<button class="go" onclick="setStatus('${o.id}','PREPARING')">Accept</button>`:''}<button onclick="setStatus('${o.id}','READY')">Mark Ready</button></div></div></article>`).join('')||'<div class="empty">Kitchen queue clear.</div>'}async function setStatus(id,status){await api('/api/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});render()}setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString('en-IN'),1000);init();</script></body></html>
