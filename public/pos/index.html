<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<meta
  http-equiv="Cache-Control"
  content="no-store, no-cache, must-revalidate, max-age=0"
/>

<meta
  http-equiv="Pragma"
  content="no-cache"
/>

<meta
  http-equiv="Expires"
  content="0"
/>

<title>Sri Ganapathy Andhra's Ruchulu · POS</title>

<link
  rel="icon"
  href="/brand/logo-icon.jpg?v=9999"
/>

<link
  rel="stylesheet"
  href="/pos/style.css?v=9999"
/>

</head>

<body>

<div id="app"></div>

<script>

(function(){

  "use strict";

  /*
   * POS entry must NEVER blindly show the billing UI.
   *
   * First validate the real HttpOnly session.
   */

  fetch(
    "/api/me",
    {
      method:"GET",

      credentials:"include",

      cache:"no-store",

      headers:{
        "Accept":"application/json",
        "Cache-Control":"no-cache"
      }
    }
  )
  .then(
    async function(response){

      var text =
        await response.text();

      var data = {};

      try{
        data =
          text
            ? JSON.parse(text)
            : {};
      }catch(_e){
        data = {};
      }

      if(
        response.status === 401 ||
        response.status === 403 ||
        !data.user
      ){

        window.location.replace(
          "/pos/login.html?auth=" +
          Date.now()
        );

        return;
      }

      if(!response.ok){

        throw new Error(
          data.error ||
          "Unable to validate POS session."
        );
      }

      /*
       * Only now load the actual POS application.
       */
      var script =
        document.createElement("script");

      script.src =
        "/pos/app.js?v=" +
        Date.now();

      script.defer = true;

      document.body.appendChild(script);

    }
  )
  .catch(
    function(error){

      console.error(
        "POS SESSION ERROR:",
        error
      );

      document.body.innerHTML =
        '<div style="' +
        'min-height:100vh;' +
        'display:flex;' +
        'align-items:center;' +
        'justify-content:center;' +
        'background:#0b0d10;' +
        'color:white;' +
        'font-family:system-ui;' +
        'padding:30px;' +
        '">' +
        '<div style="' +
        'max-width:500px;' +
        'text-align:center;' +
        '">' +
        '<h2>POS session unavailable</h2>' +
        '<p style="color:#aaa">' +
        (
          error.message ||
          "Please sign in again."
        ) +
        '</p>' +
        '<button onclick="location.replace(' +
        "'/pos/login.html?auth=' + Date.now()" +
        ')" style="' +
        'padding:12px 20px;' +
        'border:0;' +
        'border-radius:10px;' +
        'cursor:pointer;' +
        '">' +
        'Return to Login' +
        '</button>' +
        '</div>' +
        '</div>';

    }
  );

})();

</script>

</body>

</html>
