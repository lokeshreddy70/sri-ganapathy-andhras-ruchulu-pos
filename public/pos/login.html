<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
    name="robots"
    content="noindex,nofollow,noarchive">

<meta
    name="theme-color"
    content="#17120e">

<title>Sign in | Sri Ganapathy Andhra's Ruchulu</title>

<link
    rel="icon"
    type="image/jpeg"
    href="/brand/logo-primary.jpg">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#f4f1ed;
    color:#201a15;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.login-shell{
    width:min(1080px,100%);
    min-height:650px;
    display:grid;
    grid-template-columns:1fr 460px;
    overflow:hidden;
    border-radius:28px;
    background:#fff;
    border:1px solid #e5ddd4;
    box-shadow:0 30px 90px rgba(34,25,18,.13);
}

.brand-panel{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:60px;
    overflow:hidden;
    background:
        linear-gradient(
            145deg,
            #26180f 0%,
            #392418 55%,
            #1d130d 100%
        );
    color:#fff;
}

.brand-panel:before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    right:-210px;
    bottom:-210px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
        0 0 0 60px rgba(255,255,255,.025),
        0 0 0 120px rgba(255,255,255,.018);
}

.brand-content{
    position:relative;
    z-index:2;
}

.brand-logo{
    display:block;
    width:78px;
    height:78px;
    object-fit:cover;
    padding:4px;
    border-radius:19px;
    background:#fff;
    margin-bottom:34px;
    box-shadow:0 14px 35px rgba(0,0,0,.25);
}

.brand-kicker{
    margin:0 0 14px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#d9b99b;
}

.brand-name{
    margin:0;
    max-width:520px;
    font-size:clamp(38px,4.6vw,60px);
    line-height:1;
    letter-spacing:-.05em;
    font-weight:780;
}

.brand-copy{
    max-width:500px;
    margin:24px 0 0;
    color:#d8cbc0;
    font-size:15px;
    line-height:1.7;
}

.brand-footer{
    position:relative;
    z-index:2;
    color:#a8988a;
    font-size:11px;
}

.form-panel{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:52px;
}

.form-box{
    width:100%;
    max-width:365px;
}

.form-title{
    margin:0;
    font-size:34px;
    line-height:1.1;
    letter-spacing:-.04em;
    font-weight:780;
}

.form-copy{
    margin:11px 0 30px;
    color:#81766c;
    font-size:14px;
    line-height:1.6;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:700;
}

.field input{
    width:100%;
    height:54px;
    border:1px solid #dcd3ca;
    border-radius:12px;
    padding:0 15px;
    outline:none;
    background:#fff;
    color:#211b16;
    font-size:15px;
    transition:.18s ease;
}

.field input::placeholder{
    color:#aaa099;
}

.field input:hover{
    border-color:#c8bdb2;
}

.field input:focus{
    border-color:#7e6047;
    box-shadow:0 0 0 4px rgba(126,96,71,.11);
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:72px;
}

.show-password{
    position:absolute;
    right:7px;
    top:7px;
    height:40px;
    padding:0 11px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#6f6258;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.show-password:hover{
    background:#f5f1ed;
}

.login-error{
    display:none;
    margin:0 0 18px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #edcaca;
    background:#fff5f5;
    color:#a32929;
    font-size:13px;
    line-height:1.5;
}

.login-error.visible{
    display:block;
}

.login-button{
    width:100%;
    height:55px;
    margin-top:5px;
    border:0;
    border-radius:12px;
    background:#26180f;
    color:#fff;
    font-size:14px;
    font-weight:800;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:0 12px 28px rgba(38,24,15,.17);
    transition:.16s ease;
}

.login-button:hover{
    transform:translateY(-1px);
    box-shadow:0 15px 32px rgba(38,24,15,.22);
}

.login-button:active{
    transform:translateY(0);
}

.login-button:disabled{
    opacity:.62;
    cursor:wait;
    transform:none;
}

.login-status{
    min-height:18px;
    margin-top:14px;
    color:#81766c;
    font-size:12px;
    text-align:center;
}

.login-security{
    margin-top:27px;
    padding-top:19px;
    border-top:1px solid #eee8e2;
    color:#958a80;
    font-size:10.5px;
    line-height:1.6;
    text-align:center;
}

@media(max-width:820px){

    body{
        padding:14px;
    }

    .login-shell{
        grid-template-columns:1fr;
        min-height:auto;
    }

    .brand-panel{
        min-height:330px;
        padding:36px;
    }

    .brand-logo{
        width:66px;
        height:66px;
        margin-bottom:23px;
    }

    .brand-name{
        font-size:38px;
    }

    .brand-copy{
        margin-top:15px;
        font-size:14px;
    }

    .form-panel{
        padding:40px 28px 44px;
    }
}

@media(max-width:480px){

    body{
        padding:0;
        align-items:stretch;
    }

    .login-shell{
        width:100%;
        min-height:100vh;
        border:0;
        border-radius:0;
    }

    .brand-panel{
        min-height:285px;
        padding:29px 24px;
    }

    .form-panel{
        padding:34px 22px 40px;
    }

    .form-title{
        font-size:30px;
    }
}

</style>
</head>

<body>

<main class="login-shell">

<section class="brand-panel">

<div class="brand-content">

<img
    class="brand-logo"
    src="/brand/logo-primary.jpg"
    alt="Sri Ganapathy Andhra's Ruchulu">

<p class="brand-kicker">
Restaurant POS
</p>

<h1 class="brand-name">
Sri Ganapathy<br>
Andhra's Ruchulu
</h1>

<p class="brand-copy">
A focused workspace for restaurant billing,
orders, kitchen operations and branch management.
</p>

</div>

<div class="brand-footer">
Authorized staff access only
</div>

</section>


<section class="form-panel">

<div class="form-box">

<h2 class="form-title">
Welcome back
</h2>

<p class="form-copy">
Sign in to continue to your restaurant workspace.
</p>

<div
    id="loginError"
    class="login-error"
    role="alert"
    aria-live="polite">
</div>

<form
    id="loginForm"
    autocomplete="on"
    novalidate>

<div class="field">

<label for="username">
Username
</label>

<input
    id="username"
    name="username"
    type="text"
    autocomplete="username"
    autocapitalize="none"
    spellcheck="false"
    placeholder="Enter your username"
    required>

</div>


<div class="field">

<label for="password">
Password
</label>

<div class="password-wrap">

<input
    id="password"
    name="password"
    type="password"
    autocomplete="current-password"
    placeholder="Enter your password"
    required>

<button
    id="showPassword"
    class="show-password"
    type="button">
Show
</button>

</div>

</div>


<button
    id="loginButton"
    class="login-button"
    type="submit">
SIGN IN
</button>

</form>

<div
    id="loginStatus"
    class="login-status"
    aria-live="polite">
</div>

<div class="login-security">
Authenticated production account · branch access controlled
</div>

</div>

</section>

</main>


<script>

(function(){

"use strict";

const form = document.getElementById("loginForm");
const username = document.getElementById("username");
const password = document.getElementById("password");
const button = document.getElementById("loginButton");
const errorBox = document.getElementById("loginError");
const statusBox = document.getElementById("loginStatus");
const showPassword = document.getElementById("showPassword");


function clearError(){

    errorBox.textContent = "";
    errorBox.classList.remove("visible");

}


function showError(message){

    errorBox.textContent =
        message ||
        "Unable to sign in. Please try again.";

    errorBox.classList.add("visible");

    statusBox.textContent = "";

}


function loading(value){

    button.disabled = value;

    button.textContent =
        value
            ? "SIGNING IN..."
            : "SIGN IN";

}


showPassword.addEventListener(
    "click",
    function(){

        const isPassword =
            password.type === "password";

        password.type =
            isPassword
                ? "text"
                : "password";

        showPassword.textContent =
            isPassword
                ? "Hide"
                : "Show";

    }
);


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();
        event.stopPropagation();

        clearError();

        const user =
            username.value.trim();

        const pass =
            password.value;

        if(!user){

            username.focus();

            showError(
                "Please enter your username."
            );

            return;

        }

        if(!pass){

            password.focus();

            showError(
                "Please enter your password."
            );

            return;

        }

        loading(true);

        try{

            const loginResponse =
                await fetch(
                    "/api/auth/login",
                    {
                        method:"POST",
                        credentials:"include",
                        cache:"no-store",
                        headers:{
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json",

                            "Cache-Control":
                                "no-cache"
                        },
                        body:JSON.stringify({
                            username:user,
                            password:pass
                        })
                    }
                );


            let loginData = {};

            try{

                loginData =
                    await loginResponse.json();

            }catch(_){}


            if(!loginResponse.ok){

                throw new Error(
                    loginData.error ||
                    loginData.message ||
                    "Invalid username or password."
                );

            }


            if(!loginData.user){

                throw new Error(
                    "Authentication session was not created."
                );

            }


            statusBox.textContent =
                "Verifying session...";


            const sessionResponse =
                await fetch(
                    "/api/me",
                    {
                        method:"GET",
                        credentials:"include",
                        cache:"no-store",
                        headers:{
                            "Accept":
                                "application/json",

                            "Cache-Control":
                                "no-cache"
                        }
                    }
                );


            if(!sessionResponse.ok){

                throw new Error(
                    "Login succeeded, but the session could not be verified."
                );

            }


            const sessionData =
                await sessionResponse.json();


            if(!sessionData.user){

                throw new Error(
                    "Your session could not be verified."
                );

            }


            statusBox.textContent =
                "Opening POS...";


            /*
             * ONLY ONE navigation target.
             * No form reload.
             * No login.html -> login.html loop.
             */

            window.location.replace(
                "/pos/?auth=" +
                Date.now()
            );

        }
        catch(error){

            console.error(
                "SGAR LOGIN ERROR:",
                error
            );

            showError(
                error &&
                error.message
                    ? error.message
                    : "Unable to sign in."
            );

            loading(false);

        }

    },
    true
);

})();

</script>

</body>
</html>
