<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111827">
<title>Sri Ganapathy Andhra's Ruchulu POS</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:#f4f6f8;
    color:#111827;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.login-shell{
    width:100%;
    max-width:440px;
}

.login-card{
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:24px;
    padding:34px;
    box-shadow:
        0 20px 60px rgba(15,23,42,.10),
        0 2px 8px rgba(15,23,42,.04);
}

.brand{
    text-align:center;
    margin-bottom:30px;
}

.brand-mark{
    width:68px;
    height:68px;
    margin:0 auto 18px;
    border-radius:18px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
}

.brand h1{
    margin:0;
    font-size:21px;
    line-height:1.25;
    font-weight:800;
    letter-spacing:-.4px;
}

.brand p{
    margin:8px 0 0;
    color:#6b7280;
    font-size:13px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:700;
    color:#374151;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:50px;
    padding:0 14px;
    border:1px solid #d1d5db;
    border-radius:12px;
    background:#ffffff;
    color:#111827;
    font-size:15px;
    outline:none;
    transition:border-color .15s,box-shadow .15s;
}

input:focus{
    border-color:#111827;
    box-shadow:0 0 0 3px rgba(17,24,39,.08);
}

.password-toggle{
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#6b7280;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    padding:8px;
}

button[type="submit"]{
    width:100%;
    height:52px;
    margin-top:4px;
    border:0;
    border-radius:13px;
    background:#111827;
    color:#ffffff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:opacity .15s,transform .15s;
}

button[type="submit"]:hover{
    opacity:.94;
}

button[type="submit"]:active{
    transform:translateY(1px);
}

button[type="submit"]:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error{
    display:none;
    margin:0 0 16px;
    padding:11px 13px;
    border-radius:10px;
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#991b1b;
    font-size:13px;
    line-height:1.45;
}

.error.show{
    display:block;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#9ca3af;
    font-size:11px;
}

@media(max-width:520px){

    body{
        padding:14px;
    }

    .login-card{
        padding:25px 20px;
        border-radius:20px;
    }

}
</style>
</head>

<body data-page="sgar-login">

<div class="login-shell">
    <main class="login-card">

        <div class="brand">
            <div class="brand-mark">SG</div>

            <h1>
                Sri Ganapathy Andhra's Ruchulu
            </h1>

            <p>
                Point of Sale
            </p>
        </div>

        <div id="login-error" class="error" role="alert"></div>

        <form id="login-form" autocomplete="on">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                    autofocus
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrap">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        id="show-password"
                        class="password-toggle"
                        type="button"
                    >
                        Show
                    </button>

                </div>

            </div>

            <button
                id="login-submit"
                type="submit"
            >
                SIGN IN
            </button>

        </form>

        <div class="footer">
            Secure staff access
        </div>

    </main>
</div>

<script>
(function(){

    "use strict";

    const form =
        document.getElementById("login-form");

    const username =
        document.getElementById("username");

    const password =
        document.getElementById("password");

    const submit =
        document.getElementById("login-submit");

    const show =
        document.getElementById("show-password");

    const error =
        document.getElementById("login-error");

    function showError(message){

        error.textContent =
            message || "Unable to sign in.";

        error.classList.add("show");

    }

    function clearError(){

        error.textContent = "";

        error.classList.remove("show");

    }

    async function checkExistingSession(){

        try{

            const response =
                await fetch(
                    "/api/me?fresh=" +
                    Date.now(),
                    {
                        method:"GET",
                        credentials:"include",
                        cache:"no-store",
                        headers:{
                            "Accept":"application/json"
                        }
                    }
                );

            if(
                response.ok
            ){

                const data =
                    await response.json();

                if(
                    data &&
                    data.user
                ){

                    window.location.replace(
                        "/pos/index.html?fresh=" +
                        Date.now()
                    );

                    return true;

                }

            }

        }catch(_){

        }

        return false;

    }

    show.addEventListener(
        "click",
        function(){

            if(
                password.type === "password"
            ){

                password.type = "text";
                show.textContent = "Hide";

            }else{

                password.type = "password";
                show.textContent = "Show";

            }

        }
    );

    form.addEventListener(
        "submit",
        async function(event){

            event.preventDefault();

            clearError();

            const user =
                username.value.trim();

            const pass =
                password.value;

            if(
                !user ||
                !pass
            ){

                showError(
                    "Enter your username and password."
                );

                return;

            }

            submit.disabled = true;
            submit.textContent = "SIGNING IN...";

            try{

                const response =
                    await fetch(
                        "/api/auth/login",
                        {
                            method:"POST",
                            credentials:"include",
                            cache:"no-store",
                            headers:{
                                "Content-Type":
                                    "application/json",
                                "Accept":
                                    "application/json"
                            },
                            body:JSON.stringify({
                                username:user,
                                password:pass
                            })
                        }
                    );

                let data = {};

                try{
                    data =
                        await response.json();
                }catch(_){}

                if(
                    !response.ok
                ){

                    throw new Error(
                        data.error ||
                        data.message ||
                        "Invalid username or password."
                    );

                }

                const sessionCheck =
                    await fetch(
                        "/api/me?fresh=" +
                        Date.now(),
                        {
                            method:"GET",
                            credentials:"include",
                            cache:"no-store",
                            headers:{
                                "Accept":
                                    "application/json"
                            }
                        }
                    );

                if(
                    !sessionCheck.ok
                ){

                    throw new Error(
                        "Login succeeded but the session could not be established."
                    );

                }

                window.location.replace(
                    "/pos/index.html?fresh=" +
                    Date.now()
                );

            }catch(err){

                showError(
                    err &&
                    err.message
                        ? err.message
                        : "Unable to sign in. Please try again."
                );

                submit.disabled = false;
                submit.textContent = "SIGN IN";

            }

        }
    );

    /*
     * Existing authenticated users should never
     * see the login form again.
     */

    checkExistingSession();

})();
</script>

</body>
</html>
