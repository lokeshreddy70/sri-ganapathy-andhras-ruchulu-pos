[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[functions.api]
  included_files = [
    "public/**",
    "prisma/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/pos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/pos"
  to = "/pos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/pos/"
  to = "/pos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/kds"
  to = "/kds/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/kds/*"
  to = "/kds/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/order/*"
  to = "/customer/index.html"
  status = 200
  force = true