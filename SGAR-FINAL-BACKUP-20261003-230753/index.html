<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#111"
  >

  <title>Kitchen</title>

  <link
    rel="stylesheet"
    href="/kds/styles.css"
  >

</head>

<body>

  <header class="kds-header">

    <div>
      <strong>
        Kitchen
      </strong>

      <span
        id="branchName"
      >
        Loading...
      </span>
    </div>

    <button
      id="logout"
      class="kds-button secondary"
    >
      Logout
    </button>

  </header>

  <main>

    <div
      id="login"
      class="kds-login"
    >

      <form id="loginForm">

        <h2>
          Kitchen Login
        </h2>

        <input
          id="username"
          placeholder="Username"
          autocomplete="username"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <div
          id="loginError"
          class="error hidden"
        ></div>

        <button
          class="kds-button primary"
        >
          Login
        </button>

      </form>

    </div>

    <section
      id="board"
      class="kds-board hidden"
    >

      <div class="kds-column">

        <div class="kds-column-title">
          New
          <span id="pendingCount">0</span>
        </div>

        <div
          id="pending"
          class="kds-orders"
        ></div>

      </div>

      <div class="kds-column">

        <div class="kds-column-title">
          Preparing
          <span id="preparingCount">0</span>
        </div>

        <div
          id="preparing"
          class="kds-orders"
        ></div>

      </div>

      <div class="kds-column">

        <div class="kds-column-title">
          Ready
          <span id="readyCount">0</span>
        </div>

        <div
          id="ready"
          class="kds-orders"
        ></div>

      </div>

    </section>

  </main>

  <script src="/kds/app.js"></script>

</body>
</html>
